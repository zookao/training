[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# MariaDB —— 优先级 10（最先启动，数据目录 /app/db 由 volume 持久化）
[program:mysqld]
command=/usr/sbin/mysqld --user=mysql --datadir=/app/db
priority=10
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/mysqld.log
stderr_logfile=/var/log/supervisor/mysqld_err.log

# Go 后端 —— 优先级 20（等 MariaDB 就绪后启动）
[program:training]
command=/app/wait-for-mysql.sh
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/training.log
stderr_logfile=/var/log/supervisor/training_err.log

# Nginx —— 优先级 30（最后启动）；-e 让启动早期错误也走 stderr，不写 /var/log/nginx
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -e /dev/stderr
priority=30
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log

# 日志轮转 —— 优先级 40，每 60 秒检查一次日志大小并按阈值轮转
[program:logrotate]
command=/app/logrotate.sh
priority=40
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/var/log/supervisor/logrotate.log
stderr_logfile=/var/log/supervisor/logrotate_err.log

# 数据库备份 —— 优先级 50，每天 03:00 备份 training 库到 /app/db_backup（卷 training_db_backup）
[program:backup]
command=/app/backup.sh
priority=50
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/var/log/supervisor/backup.log
stderr_logfile=/var/log/supervisor/backup_err.log
